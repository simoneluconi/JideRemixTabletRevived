# Licences of this repository, per path (REUSE specification 3.2, https://reuse.software).
# A licence header inside a file wins over these defaults ("closest"). The texts are in LICENSES/.
version = 1
SPDX-PackageName = "JideRemixTabletRevived"
SPDX-PackageDownloadLocation = "https://github.com/simoneluconi/JideRemixTabletRevived"

# Tools, the mini recovery sources and the local manifests: same licence as the device tree
[[annotations]]
path = ["tools/**", "minirecovery/**", "manifests/**", ".gitignore", ".gitattributes", "REUSE.toml"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 The JideRemixTabletRevived Project"
SPDX-License-Identifier = "Apache-2.0"

# Documentation
[[annotations]]
path = ["README.md", "CLAUDE.md", "docs/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 The JideRemixTabletRevived Project"
SPDX-License-Identifier = "CC-BY-4.0"
